<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Faisal AlDossary: Android modules, privacy tools and reverse engineering">
  <title>Faisal AlDossary</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D63"/>
      <stop offset="0.55" stop-color="#1A7FC1"/>
      <stop offset="1" stop-color="#2AABEE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD500"/>
      <stop offset="1" stop-color="#F99B1C"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#sky)"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <circle cx="1080" cy="40" r="170" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="1130" cy="230" r="110" fill="#FFFFFF" fill-opacity="0.05"/>
    <!-- A paper plane, for Telegram -->
    <g transform="translate(905 58) scale(1.75)" opacity="0.95">
      <path d="M80,30 L69,78 L51,66 L42,76 L35,57 L25,48 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
      <path d="M25,48 L80,30 L35,57 Z" fill="#565A63"/>
      <path d="M35,57 L80,30 L42,76 Z" fill="#F99B1C"/>
      <path d="M80,30 L69,78 L51,66 L42,76 Z" fill="#4A4D54"/>
      <path d="M80,30 L69,78 L51,66 L42,76 L35,57 L25,48 Z" fill="none" stroke="#231F20" stroke-width="3" stroke-linejoin="round"/>
      <path d="M80,30 L35,57 M80,30 L42,76" fill="none" stroke="#231F20" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="72" y="104" font-size="22" font-weight="500" fill="#FFFFFF" fill-opacity="0.85">Hi there, I'm</text>
    <text x="72" y="158" font-size="54" font-weight="800" fill="#FFFFFF">Faisal AlDossary</text>
    <rect x="72" y="176" width="96" height="5" rx="2.5" fill="url(#gold)"/>
    <text x="72" y="216" font-size="21" fill="#FFFFFF" fill-opacity="0.92">Android modules · Privacy tools · Reverse engineering</text>
  </g>
