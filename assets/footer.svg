<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" aria-hidden="true">
  <style>
    .w1 { animation: drift 9s ease-in-out infinite alternate; }
    .w2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="90" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path class="w2" d="M-60 52 C 140 22, 340 82, 540 52 S 940 22, 1260 52 V 90 H -60 Z" fill="url(#wave)" fill-opacity=".22"/>
    <path class="w1" d="M-60 62 C 160 40, 360 90, 600 62 S 1000 38, 1260 64 V 90 H -60 Z" fill="url(#wave)" fill-opacity=".45"/>
    <path d="M-60 74 C 200 60, 400 96, 640 76 S 1020 58, 1260 78 V 90 H -60 Z" fill="#0F172A"/>
  </g>
</svg>
